services:
  web:
    build: .
    image: aksara-frontend:latest
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
